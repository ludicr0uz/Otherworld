; The Gameplay Ability System scans these paths for GameplayCue notifies at
; startup; with none set it scans all of /Game and warns. The project has no
; cues yet -- when one is added, it goes under /Game/Survival or a path added here.
[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths=/Game/Survival

; The Linux game reads its window icon, Content/Splash/Icon.bmp, as a loose file
; at start (LinuxWindow.cpp, SDL_LoadBMP), and the packaging stages only
; Splash.bmp from that folder by itself (Scripts/build_app_icons.py).
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="Splash")
; The grip nudges, Content/Tuning/grip_nudges.csv, are read by the running game as a
; loose file on every machine (Source/Otherworld/Public/OtherworldGripLibrary.h).
+DirectoriesToAlwaysStageAsNonUFS=(Path="Tuning")
; The levels a build ships. The game opens on Lvl_Title (GameDefaultMap), and
; New Game opens the forest by name (Scripts/title/paths.py PLAY_LEVEL), a
; reference the cooker cannot follow: without this list only the title is cooked.
+MapsToCook=(FilePath="/Game/Maps/Lvl_Title")
+MapsToCook=(FilePath="/Game/Maps/Lvl_Forest_1000m")
