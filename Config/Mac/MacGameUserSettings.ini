; The display the game opens on, on the Mac: the first one, which is the one
; with the menu bar. The engine's default is -1, "none chosen", and with none
; chosen UE 5.8 asks FMacWindow::GetFullScreenInfo where a full-screen window
; goes, which answers one screen height too low (2H - 1: (0, 2337) on an
; 1800x1169 screen, measured 12 Oct 2026). The engine then keeps the window
; there until the player switches apps, and everything in desktop space is off
; the screen: a shown cursor, locked to the viewport, is held on the bottom
; row (Scripts/graphics_menu/docs/history/menu.md, "The mouse cursor"). With a
; display chosen the engine takes the place from that display's own rectangle,
; which is right. The window opened on this display before, too.
[/Script/Engine.GameUserSettings]
DisplayIndex=0
LastUserConfirmedDisplayIndex=0

; The window mode stays the engine's default, WindowedFullscreen (borderless):
; exclusive Fullscreen cannot take this engine's "native" on many monitors
; (Scripts/graphics_menu/CLAUDE.md, "Full screen on the Mac"). Version is the
; engine's UE_GAMEUSERSETTINGS_VERSION: before a first save the engine reads
; none of this file at launch without it
; (UGameUserSettings::PreloadResolutionSettings).
Version=5
