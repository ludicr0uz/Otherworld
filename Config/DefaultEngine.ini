; Remote execution lets Scripts/dev/uepy.py push Python into an already-open
; editor instead of paying 35-45 s for a cold UnrealEditor-Cmd boot per script.
; The property lives on PythonScriptPluginSettings (UCLASS config=Engine), NOT
; on PythonScriptPluginUserSettings (config=EditorPerProjectUserSettings) where
; this project used to declare it -- an unknown key in a settings section is
; silently ignored, so remote execution simply never switched on. bDeveloperMode
; really is a UserSettings key and stays in DefaultEditorPerProjectUserSettings.ini.
; Changing this needs an editor restart: the ini is read when the CDO loads.
[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True

[/Script/NavigationSystem.RecastNavMesh]
; Levels here are generated by Scripts/generate_forest_level.py and their navmesh
; is never baked: a headless editor run does not tick, so the async build never
; finishes. The mesh must therefore be generated at game start.
; This is set as a CLASS DEFAULT rather than on the actor because the navigation
; system overwrites RecastNavMesh properties with class defaults when the nav
; data registers -- the same reset that clobbers AgentRadius. Setting it only on
; the actor survives an import but is silently lost the next time anything loads
; and re-saves the level, after which no tiles are ever built and AI cannot move.
RuntimeGeneration=Dynamic
; -game spawns a fresh RecastNavMesh and builds it. The EDITOR does not: it sees the
; one it re-creates on load as "loaded", skips the load-time RebuildAll
; (NeedsRebuildOnLoad() is false), and keeps it empty. PIE copies the editor's
; navmesh and does not build one of its own, so in PIE every wanderer's patrol
; query failed and it stood still. Forcing the rebuild makes the editor build on
; open. PIE still copies whatever tiles the editor has at the moment Play is
; pressed; the 1 km map takes about 2 min to finish.
bForceRebuildOnLoad=True
